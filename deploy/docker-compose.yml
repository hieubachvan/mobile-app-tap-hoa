# Chạy trên VPS ở /opt/tap-hoa (deploy.sh chép file này ra đó)
services:
  web:
    image: nginx:1.27-alpine
    container_name: tap-hoa-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - config

  # Trang cấu hình: không mở cổng ra ngoài, chỉ đi qua Nginx ở /config/
  config:
    build: ./app
    container_name: tap-hoa-config
    restart: unless-stopped
    env_file: ./config.env
    volumes:
      - ./dist:/out
      - ./data:/data
