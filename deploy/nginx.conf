server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # File có mã hash trong tên: cache lâu
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /img/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Trang cấu hình (container tap-hoa-config, có mật khẩu)
  location = /config {
    return 301 /config/;
  }

  location /config/ {
    proxy_pass http://config:3001;
    proxy_set_header X-Real-IP $remote_addr;
    # Lưu thông số sẽ build lại bản web, có thể mất vài chục giây
    proxy_read_timeout 300s;
    client_max_body_size 1m;
  }

  # index.html luôn lấy bản mới để bé nhận bản cập nhật ngay
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
